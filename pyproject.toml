[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "pbx_estimation"
version = "0.1.0"
description = "Quantitative forecasting of PBX market decline and VoIP adoption across 12+ countries"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "wbgapi>=1.0",
    "lifelines>=0.27",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "requests>=2.31",
    "papermill>=2.5",
    "nbconvert>=7.16",
]

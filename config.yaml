countries:
  asia_pacific:
    - tw: Taiwan
    - jp: Japan
    - kr: South Korea
    - cn: China
    - in: India
  europe:
    - gb: United Kingdom
    - de: Germany
    - fr: France
    - se: Sweden
    - it: Italy
  americas:
    - us: United States
    - ca: Canada
    - br: Brazil

model:
  logistic_growth:
    death_threshold: 0.3  # Market considered "dead" when penetration falls below 30% of its historical peak (≈70% decline = legacy PBX no longer the primary access tech). 0.05 (near-extinction) left too few events to identify the survival model and decoupled it from reality.
    initial_guess:
      K: 50
      r: 0.3
      t0: 2010
  survival:
    duration_col: "market_lifetime"
    event_col: "product_dead"
    covariates:
      - has_pstn_phaseout
      - broadband_penetration
      - gdp_per_capita
      - urbanization

data:
  world_bank:
    indicators:
      fixed_subs: "IT.MLT.MAIN.P2"           # Fixed telephone subscriptions (per 100 people)
      broadband: "IT.NET.BBND.P2"             # Fixed broadband subscriptions (per 100 people)
      gdp_per_capita: "NY.GDP.PCAP.CD"
      urban_pop: "SP.URB.TOTL.IN.ZS"
    start_year: 2000
    end_year: 2025
  itu:
    url: "https://www.itu.int/en/ITU-D/Statistics/Pages/stat/default.aspx"
    api_base: "https://api.datahub.itu.int/v2"
    indicators:
      fixed_subs: 15              # Fixed-telephone subscriptions
      fixed_broadband: 19303      # Fixed-broadband subscriptions
      internet_users: 11624       # Individuals using the Internet
    start_year: 2000
    end_year: 2025
  uk_parliament:
    briefing_url: "https://commonslibrary.parliament.uk/research-briefings/cbp-9471/"
    pdf_url: "https://researchbriefings.files.parliament.uk/documents/CBP-9471/CBP-9471.pdf"
    country_code: gb
  cept:
    report_url: "https://docdb.cept.org/download/1301"
    report_title: "ECC Report 265 - Migration from PSTN/ISDN to IP-based networks"
  ncc:
    mobile_stats_csv: "https://api.ncc.gov.tw/uploaddowndoc?file=datagov/%E8%A1%8C%E5%8B%95%E9%80%9A%E4%BF%A1%E6%A5%AD%E5%8B%99%E7%94%A8%E6%88%B6%E7%B5%B1%E8%A8%88%E6%95%B8.csv&filedisplay=%E8%A1%8C%E5%8B%95%E9%80%9A%E4%BF%A1%E6%A5%AD%E5%8B%99%E7%94%A8%E6%88%B6%E7%B5%B1%E8%A8%88%E6%95%B8.csv&flag=doc"
    telecom_numbers_csv: "https://www-api.moda.gov.tw/OpenData/Files/15304"
    dataset_api: "https://data.gov.tw/api/v2/rest/dataset/173231"
    country_code: tw
  berec:
    report_url: "https://www.berec.europa.eu/system/files/2024-12/BoR%20(24)%20181_Draft%20BEREC%20Report%20on%20copper%20switch-off_0.pdf"
  pstn_switchoff:
    # Authoritative dates from BEREC (EU) + national regulators
    # Values: year of complete closure, or null if no announced date
    nl: 2019    # Netherlands (KPN: Sep 2019)
    ee: 2017    # Estonia
    de: 2020    # Germany (99% migrated by 2020)
    no: 2022    # Norway (Telenor: Dec 2022)
    ch: 2019    # Switzerland
    es: 2025    # Spain (CNMC: May 2025)
    se: 2026    # Sweden
    mt: 2026    # Malta
    gb: 2027    # UK (BT/Openreach: Jan 2027)
    fr: 2030    # France (Orange staged through 2030)
    dk: 2030    # Denmark
    lu: 2030    # Luxembourg
    pt: 2030    # Portugal
    it: 2028    # Italy (MDFs only, SCs remain)
    be: 2040    # Belgium
    tw: ~       # Taiwan: no PSTN phase-out date announced
    jp: ~       # Japan: no national date
    kr: ~       # South Korea: no national date
    cn: ~       # China: no national date
    in: ~       # India: no national date
    us: ~       # US: state-level, no federal date
    ca: ~       # Canada: no national date
    br: ~       # Brazil: no national date

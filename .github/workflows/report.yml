name: Report Generation and Pages Deploy

on:
  push:
    branches:
      - deploy/pages-clean
  schedule:
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      refetch_data:
        description: "Force re-download all raw data (skips cache)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: v1

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache downloaded data
        if: ${{ ! inputs.refetch_data }}
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ${{ env.CACHE_VERSION }}-raw-data-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-raw-data-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run notebooks
        run: |
          set -euo pipefail
          for nb in \
            01_fetch_data \
            02_eda_visualization \
            03_logistic_growth \
            04_survival_analysis \
            05_verify_pipeline \
            06_product_research \
            07_tech_alternatives
          do
            papermill "notebooks/${nb}.ipynb" "notebooks/${nb}_output.ipynb" --log-output --progress-bar
          done

      - name: Generate shared research outputs
        run: python scripts/generate_research_outputs.py

      - name: Convert notebooks to HTML and PDF
        run: |
          set -euo pipefail
          mkdir -p reports
          for nb in notebooks/*_output.ipynb; do
            name=$(basename "$nb" _output.ipynb)
            jupyter nbconvert "$nb" --to html --output-dir reports --output "${name}.html"
            jupyter nbconvert "$nb" --to pdf --output-dir reports --output "${name}.pdf" || \
              echo "PDF conversion skipped for ${name} (check pandoc/tex installation)"
          done

      - name: Build bilingual frontend
        run: |
          set -euo pipefail
          rm -rf site frontend/public/reports
          mkdir -p site frontend/public/reports
          cp -R reports/. frontend/public/reports/
          cd frontend
          NEXT_PUBLIC_LANG=zh npm run build
          mkdir -p ../site/zh
          cp -R out/. ../site/zh/
          NEXT_PUBLIC_LANG=en npm run build
          mkdir -p ../site/en
          cp -R out/. ../site/en/
          cd ..
          mkdir -p site/reports
          cp -R reports/. site/reports/
          mkdir -p site/zh/reports site/en/reports
          cp -R reports/. site/zh/reports/
          cp -R reports/. site/en/reports/
          cp reports/index.html site/index.html

      - name: Upload reports as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbx-reports-${{ github.run_id }}
          path: |
            reports/
            data/processed/*.csv
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

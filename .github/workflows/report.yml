name: Report Generation

on:
  schedule:
    # 1st of every month at 00:00 UTC
    - cron: "0 0 1 * *"
  workflow_dispatch:
    inputs:
      refetch_data:
        description: "Force re-download all raw data (skips cache)"
        type: boolean
        default: false

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: v1

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache downloaded data
        if: ${{ ! inputs.refetch_data }}
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ${{ env.CACHE_VERSION }}-raw-data-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-raw-data-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 01_fetch_data.ipynb
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require("child_process");
            execSync(
              "papermill notebooks/01_fetch_data.ipynb " +
              "notebooks/01_fetch_data_output.ipynb " +
              "--log-output --progress-bar",
              { stdio: "inherit" }
            );

      - name: Run 02_eda_visualization.ipynb
        run: |
          papermill notebooks/02_eda_visualization.ipynb \
            notebooks/02_eda_visualization_output.ipynb \
            --log-output --progress-bar

      - name: Run 03_logistic_growth.ipynb
        run: |
          papermill notebooks/03_logistic_growth.ipynb \
            notebooks/03_logistic_growth_output.ipynb \
            --log-output --progress-bar

      - name: Run 04_survival_analysis.ipynb
        run: |
          papermill notebooks/04_survival_analysis.ipynb \
            notebooks/04_survival_analysis_output.ipynb \
            --log-output --progress-bar

      - name: Convert notebooks to HTML
        run: |
          mkdir -p reports
          for nb in notebooks/*_output.ipynb; do
            name=$(basename "$nb" _output.ipynb)
            jupyter nbconvert "$nb" --to html --output-dir reports/ --output "${name}.html"
          done

      - name: Upload reports as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbx-reports-${{ github.run_id }}
          path: reports/
          retention-days: 90

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Copy reports into Next.js public directory
        run: |
          mkdir -p frontend/public/reports
          # Only HTML reports; .gitkeep and PDFs are excluded
          cp reports/*.html frontend/public/reports/

      - name: Build Next.js static site
        run: npm run build
        working-directory: frontend

      - name: Verify build output
        run: ls -la frontend/out/ frontend/out/reports/ 2>/dev/null || true

      - name: Configure GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

      - name: Deploy to GitHub Pages
        if: ${{ github.ref == 'refs/heads/main' }}
        id: deploy
        uses: actions/deploy-pages@v4

name: Report Generation and Pages Deploy

on:
  push:
    branches:
      - main
      - deploy/pages-clean
      - deploy/pages-ui-crawler
      - deploy/pages-ui-crawler-clean
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      refetch_data:
        description: "Force re-download all raw data (skips cache)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: v1
  RAG_ASSET_PREFIX: latest
  RESEARCH_MCP_RELEASE_TAG: research-mcp-latest

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache downloaded data
        if: ${{ ! inputs.refetch_data }}
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ${{ env.CACHE_VERSION }}-raw-data-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-raw-data-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build research MCP service image
        run: docker build -f services/research_mcp/Dockerfile -t pbx-research-mcp:ci .

      - name: Generate crawler seed context and shared research outputs
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -e PBX_WORKSPACE=/workspace pbx-research-mcp:ci generate

      - name: Commit crawler summary back to main
        if: ${{ github.event_name == 'schedule' || github.ref_name == 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md frontend/data/*.json
          git add -f data/processed/solution_registry.csv data/processed/awesome_list.csv
          git add -f reports/global_research_report_*.md reports/global_research_report_*.html reports/index.html
          if git diff --cached --quiet; then
            echo "No crawler summary changes to commit."
          else
            git commit -m "chore: update crawler summary"
            git push origin HEAD:main
          fi

      - name: Run notebooks
        run: |
          set -euo pipefail
          for nb in \
            01_fetch_data \
            02_eda_visualization \
            03_logistic_growth \
            04_survival_analysis \
            05_verify_pipeline \
            06_product_research \
            07_tech_alternatives
          do
            papermill "notebooks/${nb}.ipynb" "notebooks/${nb}_output.ipynb" --log-output --progress-bar
          done

      - name: Refresh shared research outputs after notebooks
        run: docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/workspace" -e PBX_WORKSPACE=/workspace pbx-research-mcp:ci generate

      - name: Convert notebooks to HTML and optional PDF
        run: |
          set -euo pipefail
          mkdir -p reports
          can_convert_pdf=false
          if command -v pandoc >/dev/null 2>&1 && command -v xelatex >/dev/null 2>&1; then
            can_convert_pdf=true
          else
            echo "PDF conversion disabled because pandoc and/or xelatex is not installed on this runner."
          fi
          for nb in notebooks/*_output.ipynb; do
            name=$(basename "$nb" _output.ipynb)
            jupyter nbconvert "$nb" --to html --output-dir reports --output "${name}.html"
            if [ "$can_convert_pdf" = "true" ]; then
              jupyter nbconvert "$nb" --to pdf --output-dir reports --output "${name}.pdf"
            else
              echo "PDF conversion skipped for ${name}."
            fi
          done

      - name: Build RAG asset manifest
        run: python scripts/sync_rag_assets.py --prefix "${RAG_ASSET_PREFIX}"

      - name: Package research MCP release assets
        run: |
          set -euo pipefail
          rm -rf release
          mkdir -p release/pbx-research-mcp
          cp -R services/research_mcp release/pbx-research-mcp/
          mkdir -p release/pbx-research-mcp/frontend/data
          cp frontend/data/*.json release/pbx-research-mcp/frontend/data/
          mkdir -p release/pbx-research-mcp/data/processed
          cp data/processed/awesome_list.csv release/pbx-research-mcp/data/processed/
          cp data/processed/solution_registry.csv release/pbx-research-mcp/data/processed/
          mkdir -p release/pbx-research-mcp/reports
          cp reports/global_research_report_*.html release/pbx-research-mcp/reports/
          cp reports/global_research_report_*.md release/pbx-research-mcp/reports/
          cp reports/index.html release/pbx-research-mcp/reports/
          cp rag_engine/dist/rag_assets_manifest.json release/pbx-research-mcp/
          cat > release/pbx-research-mcp/RELEASE.json <<EOF
          {
            "name": "pbx-research-mcp",
            "tag": "${RESEARCH_MCP_RELEASE_TAG}",
            "run_id": "${GITHUB_RUN_ID}",
            "run_number": "${GITHUB_RUN_NUMBER}",
            "sha": "${GITHUB_SHA}",
            "created_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          tar -czf release/pbx-research-mcp-latest.tar.gz -C release pbx-research-mcp

      - name: Publish research MCP release
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.ref_name == 'main' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          Rolling release for the PBX research MCP service and generated crawler/research assets.

          Commit: ${GITHUB_SHA}
          Workflow run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          Asset:
          - pbx-research-mcp-latest.tar.gz
          EOF
          if gh release view "${RESEARCH_MCP_RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RESEARCH_MCP_RELEASE_TAG}" release/pbx-research-mcp-latest.tar.gz --clobber
            gh release edit "${RESEARCH_MCP_RELEASE_TAG}" \
              --title "PBX Research MCP Latest" \
              --notes-file "${notes_file}"
          else
            gh release create "${RESEARCH_MCP_RELEASE_TAG}" release/pbx-research-mcp-latest.tar.gz \
              --title "PBX Research MCP Latest" \
              --notes-file "${notes_file}"
          fi

      - name: Check RAG upload configuration
        id: rag_config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_S3_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_R2_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_S3_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY }}
          NOTEBOOKLM_UPLOAD_URL: ${{ secrets.NOTEBOOKLM_UPLOAD_URL }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_R2_BUCKET}" ] && { { [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; } || { [ -n "${CLOUDFLARE_R2_S3_ACCESS_KEY_ID}" ] && [ -n "${CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY}" ] && { [ -n "${CLOUDFLARE_R2_S3_ENDPOINT}" ] || [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; }; }; }; then
            echo "cloudflare_r2_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_r2_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${NOTEBOOKLM_UPLOAD_URL}" ]; then
            echo "notebooklm_upload_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "notebooklm_upload_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${HF_TOKEN}" ] && [ -n "${HF_SPACE_ID}" ]; then
            echo "hf_space_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "hf_space_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload RAG assets to Cloudflare R2
        if: ${{ steps.rag_config.outputs.cloudflare_r2_enabled == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_R2_S3_ENDPOINT: ${{ secrets.CLOUDFLARE_R2_S3_ENDPOINT }}
          CLOUDFLARE_R2_S3_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_S3_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          upload_with_wrangler_remote() {
            npx wrangler r2 object put --remote "${CLOUDFLARE_R2_BUCKET}/${RAG_ASSET_PREFIX}/rag_engine/dist/rag_assets_manifest.json" --file rag_engine/dist/rag_assets_manifest.json
            while IFS=$'\t' read -r key path; do
              npx wrangler r2 object put --remote "${CLOUDFLARE_R2_BUCKET}/${key}" --file "${path}"
            done < rag_engine/dist/rag_assets_r2.tsv
          }

          can_use_s3_api() {
            if [ -z "${CLOUDFLARE_R2_S3_ACCESS_KEY_ID}" ] || [ -z "${CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY}" ]; then
              return 1
            fi
            if [ "${#CLOUDFLARE_R2_S3_ACCESS_KEY_ID}" -ne 32 ]; then
              echo "CLOUDFLARE_R2_S3_ACCESS_KEY_ID is ${#CLOUDFLARE_R2_S3_ACCESS_KEY_ID} characters; Cloudflare R2 S3 Access Key IDs are 32 characters."
              echo "Use Cloudflare Dashboard > R2 > Manage R2 API Tokens > Access Key ID, not the Cloudflare API token or token id."
              return 1
            fi
            return 0
          }

          upload_with_s3_api() {
            python -m pip install --quiet awscli
            export AWS_ACCESS_KEY_ID="${CLOUDFLARE_R2_S3_ACCESS_KEY_ID}"
            export AWS_SECRET_ACCESS_KEY="${CLOUDFLARE_R2_S3_SECRET_ACCESS_KEY}"
            export AWS_DEFAULT_REGION=auto
            s3_endpoint="${CLOUDFLARE_R2_S3_ENDPOINT:-https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com}"
            s3_endpoint="${s3_endpoint%/}"
            s3_endpoint="${s3_endpoint%/${CLOUDFLARE_R2_BUCKET}}"
            aws --endpoint-url "${s3_endpoint}" s3 cp rag_engine/dist/rag_assets_manifest.json "s3://${CLOUDFLARE_R2_BUCKET}/${RAG_ASSET_PREFIX}/rag_engine/dist/rag_assets_manifest.json"
            while IFS=$'\t' read -r key path; do
              aws --endpoint-url "${s3_endpoint}" s3 cp "${path}" "s3://${CLOUDFLARE_R2_BUCKET}/${key}"
            done < rag_engine/dist/rag_assets_r2.tsv
          }

          if can_use_s3_api; then
            upload_with_s3_api
          elif [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "Falling back to Wrangler remote upload."
            upload_with_wrangler_remote
          else
            echo "Cloudflare R2 upload is configured but no valid upload credentials are available."
            exit 1
          fi

      - name: Upload RAG assets to NotebookLM-compatible endpoint
        if: ${{ steps.rag_config.outputs.notebooklm_upload_enabled == 'true' }}
        env:
          NOTEBOOKLM_UPLOAD_URL: ${{ secrets.NOTEBOOKLM_UPLOAD_URL }}
          NOTEBOOKLM_API_TOKEN: ${{ secrets.NOTEBOOKLM_API_TOKEN }}
        run: python scripts/sync_rag_assets.py --prefix "${RAG_ASSET_PREFIX}" --upload-notebooklm

      - name: Deploy Cloudflare RAG Worker
        if: ${{ steps.rag_config.outputs.cloudflare_r2_enabled == 'true' }}
        working-directory: rag_engine
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler deploy

      - name: Deploy RAG engine to Hugging Face Docker Space
        if: ${{ steps.rag_config.outputs.hf_space_enabled == 'true' }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: ${{ secrets.HF_SPACE_ID }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade "huggingface_hub[cli]"
          hf repos create "${HF_SPACE_ID}" --type space --space-sdk docker --exist-ok
          hf upload "${HF_SPACE_ID}" rag_engine --type space \
            --exclude ".wrangler/*" \
            --exclude "node_modules/*" \
            --commit-message "deploy rag engine"

      - name: Build bilingual frontend
        env:
          NEXT_PUBLIC_CLOUD_RAG_ENDPOINT: ${{ secrets.CLOUD_RAG_ENDPOINT }}
          NEXT_PUBLIC_SITE_BASE_PATH: ${{ vars.NEXT_PUBLIC_SITE_BASE_PATH }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
        run: |
          set -euo pipefail
          if [ -z "${NEXT_PUBLIC_CLOUD_RAG_ENDPOINT}" ]; then
            echo "CLOUD_RAG_ENDPOINT secret is empty; frontend Cloud RAG would be disabled."
            exit 1
          fi
          if [ -n "${PAGES_CUSTOM_DOMAIN}" ] && { [ -z "${NEXT_PUBLIC_SITE_BASE_PATH}" ] || [ "${NEXT_PUBLIC_SITE_BASE_PATH}" = "/pbx_estimation" ]; }; then
            NEXT_PUBLIC_SITE_BASE_PATH="/"
          elif [ -z "${NEXT_PUBLIC_SITE_BASE_PATH}" ]; then
            NEXT_PUBLIC_SITE_BASE_PATH="/pbx_estimation"
          fi
          export NEXT_PUBLIC_SITE_BASE_PATH
          echo "Building frontend with NEXT_PUBLIC_SITE_BASE_PATH=${NEXT_PUBLIC_SITE_BASE_PATH}"
          rm -rf site frontend/public/reports
          mkdir -p site frontend/public/reports
          cp -R reports/. frontend/public/reports/
          cd frontend
          NEXT_PUBLIC_LANG=zh npm run build
          mkdir -p ../site/zh
          cp -R out/. ../site/zh/
          NEXT_PUBLIC_LANG=en npm run build
          mkdir -p ../site/en
          cp -R out/. ../site/en/
          cd ..
          mkdir -p site/reports
          cp -R reports/. site/reports/
          mkdir -p site/zh/reports site/en/reports
          cp -R reports/. site/zh/reports/
          cp -R reports/. site/en/reports/
          if [ "${NEXT_PUBLIC_SITE_BASE_PATH}" = "/" ]; then
            mkdir -p site/pbx_estimation
            cp -R site/zh site/pbx_estimation/zh
            cp -R site/en site/pbx_estimation/en
            cp -R site/reports site/pbx_estimation/reports
            cat > site/index.html <<'EOF'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta http-equiv="refresh" content="0; url=/zh/">
          <script>location.replace("/zh/");</script>
          <a href="/zh/">Open PBX Estimation</a>
          EOF
          else
            cp reports/index.html site/index.html
          fi
          if [ -n "${PAGES_CUSTOM_DOMAIN}" ]; then
            printf '%s\n' "${PAGES_CUSTOM_DOMAIN}" > site/CNAME
          fi
          touch site/.nojekyll

      - name: Upload reports as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbx-reports-${{ github.run_id }}
          path: |
            reports/
            data/processed/*.csv
            rag_engine/dist/rag_assets_manifest.json
            rag_engine/dist/notebooklm_sources/
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Purge Cloudflare cache for custom domain
        if: ${{ vars.PAGES_CUSTOM_DOMAIN != '' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_CUSTOM_DOMAIN: ${{ vars.PAGES_CUSTOM_DOMAIN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -uo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "CLOUDFLARE_API_TOKEN not set; skipping Cloudflare cache purge."
            exit 0
          fi
          api="https://api.cloudflare.com/client/v4"
          # Root zone is the registrable domain (last two labels) of the custom host.
          root_domain="$(echo "${PAGES_CUSTOM_DOMAIN}" | awk -F. '{print $(NF-1)"."$NF}')"
          zone_id="${CLOUDFLARE_ZONE_ID:-}"
          if [ -z "${zone_id}" ]; then
            zone_id="$(curl -s -X GET "${api}/zones?name=${root_domain}&status=active" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              | python3 -c 'import sys,json; r=json.load(sys.stdin).get("result") or []; print(r[0]["id"] if r else "")' 2>/dev/null)"
          fi
          if [ -z "${zone_id}" ]; then
            echo "Could not resolve Cloudflare zone for ${root_domain}; skipping purge."
            echo "Set repository variable CLOUDFLARE_ZONE_ID, or use a token with Zone:Read + Cache Purge."
            exit 0
          fi
          echo "Purging Cloudflare cache for host ${PAGES_CUSTOM_DOMAIN} (zone ${zone_id})."
          resp="$(curl -s -X POST "${api}/zones/${zone_id}/purge_cache" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "{\"hosts\":[\"${PAGES_CUSTOM_DOMAIN}\"]}")"
          echo "${resp}"
          echo "${resp}" | grep -q '"success":true' || echo "Cloudflare purge did not report success (non-fatal)."

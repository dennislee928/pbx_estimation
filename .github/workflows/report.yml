name: Report Generation and Pages Deploy

on:
  push:
    branches:
      - main
      - deploy/pages-clean
      - deploy/pages-ui-crawler
      - deploy/pages-ui-crawler-clean
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      refetch_data:
        description: "Force re-download all raw data (skips cache)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  CACHE_VERSION: v1
  RAG_ASSET_PREFIX: latest

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}
          fetch-depth: 0

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache downloaded data
        if: ${{ ! inputs.refetch_data }}
        uses: actions/cache@v4
        with:
          path: data/raw
          key: ${{ env.CACHE_VERSION }}-raw-data-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_VERSION }}-raw-data-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Generate crawler seed context and shared research outputs
        run: python scripts/generate_research_outputs.py

      - name: Commit crawler summary back to main
        if: ${{ github.event_name == 'schedule' || github.ref_name == 'main' }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/processed/solution_registry.csv data/processed/awesome_list.csv frontend/data/*.json reports/global_research_report_*.md reports/global_research_report_*.html reports/index.html
          if git diff --cached --quiet; then
            echo "No crawler summary changes to commit."
          else
            git commit -m "chore: update crawler summary"
            git push origin HEAD:main
          fi

      - name: Run notebooks
        run: |
          set -euo pipefail
          for nb in \
            01_fetch_data \
            02_eda_visualization \
            03_logistic_growth \
            04_survival_analysis \
            05_verify_pipeline \
            06_product_research \
            07_tech_alternatives
          do
            papermill "notebooks/${nb}.ipynb" "notebooks/${nb}_output.ipynb" --log-output --progress-bar
          done

      - name: Refresh shared research outputs after notebooks
        run: python scripts/generate_research_outputs.py

      - name: Convert notebooks to HTML
        run: |
          set -euo pipefail
          mkdir -p reports
          for nb in notebooks/*_output.ipynb; do
            name=$(basename "$nb" _output.ipynb)
            jupyter nbconvert "$nb" --to html --output-dir reports --output "${name}.html"
            jupyter nbconvert "$nb" --to pdf --output-dir reports --output "${name}.pdf" || \
              echo "PDF conversion skipped for ${name} (check pandoc/tex installation)"
          done

      - name: Build RAG asset manifest
        run: python scripts/sync_rag_assets.py --prefix "${RAG_ASSET_PREFIX}"

      - name: Check RAG upload configuration
        id: rag_config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          NOTEBOOKLM_UPLOAD_URL: ${{ secrets.NOTEBOOKLM_UPLOAD_URL }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN}" ] && [ -n "${CLOUDFLARE_ACCOUNT_ID}" ] && [ -n "${CLOUDFLARE_R2_BUCKET}" ]; then
            echo "cloudflare_r2_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "cloudflare_r2_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "${NOTEBOOKLM_UPLOAD_URL}" ]; then
            echo "notebooklm_upload_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "notebooklm_upload_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload RAG assets to Cloudflare R2
        if: ${{ steps.rag_config.outputs.cloudflare_r2_enabled == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          set -euo pipefail
          npx wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${RAG_ASSET_PREFIX}/rag_engine/dist/rag_assets_manifest.json" --file rag_engine/dist/rag_assets_manifest.json
          while IFS=$'\t' read -r key path; do
            npx wrangler r2 object put "${CLOUDFLARE_R2_BUCKET}/${key}" --file "${path}"
          done < rag_engine/dist/rag_assets_r2.tsv

      - name: Upload RAG assets to NotebookLM-compatible endpoint
        if: ${{ steps.rag_config.outputs.notebooklm_upload_enabled == 'true' }}
        env:
          NOTEBOOKLM_UPLOAD_URL: ${{ secrets.NOTEBOOKLM_UPLOAD_URL }}
          NOTEBOOKLM_API_TOKEN: ${{ secrets.NOTEBOOKLM_API_TOKEN }}
        run: python scripts/sync_rag_assets.py --prefix "${RAG_ASSET_PREFIX}" --upload-notebooklm

      - name: Build bilingual frontend
        env:
          NEXT_PUBLIC_CLOUD_RAG_ENDPOINT: ${{ secrets.CLOUD_RAG_ENDPOINT }}
        run: |
          set -euo pipefail
          rm -rf site frontend/public/reports
          mkdir -p site frontend/public/reports
          cp -R reports/. frontend/public/reports/
          cd frontend
          NEXT_PUBLIC_LANG=zh npm run build
          mkdir -p ../site/zh
          cp -R out/. ../site/zh/
          NEXT_PUBLIC_LANG=en npm run build
          mkdir -p ../site/en
          cp -R out/. ../site/en/
          cd ..
          mkdir -p site/reports
          cp -R reports/. site/reports/
          mkdir -p site/zh/reports site/en/reports
          cp -R reports/. site/zh/reports/
          cp -R reports/. site/en/reports/
          cp reports/index.html site/index.html
          touch site/.nojekyll

      - name: Upload reports as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pbx-reports-${{ github.run_id }}
          path: |
            reports/
            data/processed/*.csv
            rag_engine/dist/rag_assets_manifest.json
            rag_engine/dist/notebooklm_sources/
          retention-days: 90

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

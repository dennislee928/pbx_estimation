# Global PBX/VoIP Solutions Registry
# Lifecycle categories: cutting_edge, mature_active, most_used_current, most_used_eol
# Sources: vendor announcements, Gartner UCaaS MQ, Cavell Group, IDC, MIC Taiwan

asia_pacific:
  tw:
    cutting_edge:
      - name: EVOX Cloud PBX
        vendor: EVOX
        description: Cloud-native UCaaS targeting TW SMB with Teams/Salesforce integration
        tags: [cloud, ucaas, api]
        pros: [Local support, Chinese UI, Teams API integration, easy setup]
        cons: [Internet dependency, monthly subscription cost, limited analog support]
        typical_customers: SME 10-500 seats
      - name: RingCentral MVP Taiwan
        vendor: RingCentral
        description: Global UCaaS platform with local PSTN breakout in TW
        tags: [cloud, ucaas, api, webrtc]

        vendor: Open Source / Digium
        description: Most widely deployed open-source PBX platform globally
        tags: [ip_pbx, sip, open_source, linux]
        pros: [Free, huge community, infinite customization, any hardware]
        cons: [Requires Linux admin, no official support, DIY security patching]
        typical_customers: Tech-savvy SMB, SI VARs
      - name: 3CX IP-PBX
        vendor: 3CX
        description: Windows/Linux software PBX with web management
        tags: [ip_pbx, sip, windows, linux, web_management]
        pros: [User-friendly web console, mobile/desktop softphone included, low TCO]
        cons: [Annual license cost, limited analog FXO/FXS without gateway]
        typical_customers: SME 5-500 seats
      - name: Cisco Unified Communications Manager
        vendor: Cisco
        description: Enterprise-grade IP-PBX with full UC suite
        tags: [ip_pbx, sip, enterprise, h323]
        pros: [Enterprise reliability, extensive feature set, global support]
        cons: [High TCO, complex licensing, requires certified admins]
        typical_customers: Enterprise, government, education

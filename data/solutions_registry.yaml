        cons: [Proprietary features, limited API, long contract]
        typical_customers: TW SME with CHT fiber
      - name: Panasonic KX-NS系列
        vendor: Panasonic
        description: Hybrid IP-PBX, widely installed across TW SMB
        tags: [ip_pbx, hybrid, fxs, fxo]
        pros: [Analog phone support, reliable hardware, local SI network]
        cons: [EOL announced 2021, no more firmware, parts via secondary market]
        typical_customers: TW SMB with legacy analog phones
